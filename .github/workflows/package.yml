name: Package
# Unsigned internal-distribution artifacts (dst-desktop-ht).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  mac-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - name: Build unsigned DMG
        working-directory: dsh-plugin-desktop
        run: node node_modules/electron-builder/cli.js --mac dmg --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dst-desktop-ht-macos-dmg
          path: dsh-plugin-desktop/dist/*.dmg
          retention-days: 30

  win-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: dst-desktop-ht-windows-nsis
          path: dsh-plugin-desktop/dist/*.exe
          retention-days: 30

  publish-release:
    needs: [mac-dmg, win-nsis]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create latest --repo "$GITHUB_REPOSITORY" --title "最新构建" \
            --notes "内部分发版（预装 dsh-better-sidebar）。未签名：macOS 首次打开请右键→打开；Windows 出现 SmartScreen 时选「更多信息→仍要运行」。" \
            || true
          gh release upload latest --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/dst-desktop-ht-macos-dmg/"*.dmg \
            "dist/dst-desktop-ht-windows-nsis/"*.exe
          gh release edit latest --repo "$GITHUB_REPOSITORY" --latest

