name: Package
# Unsigned internal-distribution artifacts (dst-desktop-ht).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  mac-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - name: Build unsigned DMG
        working-directory: dsh-plugin-desktop
        run: node node_modules/electron-builder/cli.js --mac dmg --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dst-desktop-ht-macos-dmg
          path: dsh-plugin-desktop/dist/*.dmg
          retention-days: 30

  win-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn install --immutable
      # The desktop workspace's own build script builds the pre-bundled
      # plugins first, so dist:win's single build path stays intact — a second
      # build here corrupted the installer's inner zip on Windows runners.
      - run: yarn dist:win
      # Portable ZIP variant: locked-down corporate machines may intercept an
      # NSIS self-extractor's reads of its own payload (CRC/extraction failures
      # despite a byte-perfect file). A plain zip + plain exe avoids that path.
      - name: Build portable ZIP
        working-directory: dsh-plugin-desktop
        run: node node_modules/electron-builder/cli.js --win zip --x64 --publish never --config.npmRebuild=false
      # Decisive check for "does the NSIS package install at all": silent-install
      # it on this clean runner. Passing here while a managed corporate machine
      # fails the integrity check proves the failure is environmental.
      - name: Smoke-install the NSIS package
        shell: pwsh
        working-directory: dsh-plugin-desktop
        run: |
          $exe = Get-Item dist/*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $app = "$env:LOCALAPPDATA\Programs\DSH Desktop\DSH Desktop.exe"
          if (!(Test-Path $app)) { throw "installed app missing: $app" }
          Write-Host "silent install OK: $app"
      # Launch the installed app for 30s and require it to stay up; on early
      # exit, dump captured renderer/host logs so a boot crash is diagnosable
      # from the CI log instead of a colleague's machine.
      - name: Launch smoke (30s alive, logs on failure)
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\DSH Desktop\DSH Desktop.exe"
          $out = Join-Path $env:TEMP 'dsh-stdout.log'
          $err = Join-Path $env:TEMP 'dsh-stderr.log'
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $p = Start-Process $app -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Host '--- STDOUT ---'; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host '--- STDERR ---'; Get-Content $err -ErrorAction SilentlyContinue
            throw "app exited during boot (code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'launch smoke OK: app stayed up 30s'
      - uses: actions/upload-artifact@v4
        with:
          name: dst-desktop-ht-windows-nsis
          path: |
            dsh-plugin-desktop/dist/*.exe
            dsh-plugin-desktop/dist/*.zip
          retention-days: 30

  publish-release:
    needs: [mac-dmg, win-nsis]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create latest --repo "$GITHUB_REPOSITORY" --title "最新构建" \
            --notes "内部分发版（预装 dsh-better-sidebar）。未签名：macOS 首次打开请右键→打开；Windows 出现 SmartScreen 时选「更多信息→仍要运行」。" \
            || true
          gh release upload latest --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/dst-desktop-ht-macos-dmg/"*.dmg \
            "dist/dst-desktop-ht-windows-nsis/"*.exe \
            "dist/dst-desktop-ht-windows-nsis/"*.zip
          gh release edit latest --repo "$GITHUB_REPOSITORY" --latest

