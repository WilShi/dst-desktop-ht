enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules

# Git dependencies allowed in this product workspace (vendored plugin sources).
approvedGitRepositories:
  - 'https://github.com/titanwings/dsh-automation.git'

# The vendored automation plugin imports these host packages without declaring
# them (upstream relies on its own lockfile layout); declare the edges here so
# the vendored copy stays pristine.
packageExtensions:
  '@dsh-external/dsh-automation@*':
    peerDependencies:
      '@deepseek-ai/cordis': '4.0.1'
      '@deepseek-ai/dsh-agent': '0.1.0-rc.6'
      '@deepseek-ai/dsh-llm': '0.1.0-rc.6'
      '@deepseek-ai/dsh-sandbox-policy': '0.1.0-rc.6'
      '@deepseek-ai/dsh-session': '0.1.0-rc.6'
      '@deepseek-ai/dsh-tools': '0.1.0-rc.6'
      '@deepseek-ai/dsh-user-approval': '0.1.0-rc.6'
      '@deepseek-ai/dsh-workspace': '0.1.0-rc.6'
      '@deepseek-ai/schemastery': '^3.18.1'
