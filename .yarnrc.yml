enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules

# Freshly published pre-bundled plugins trip the release-age quarantine gate.
npmPreapprovedPackages:
  - '@opendsh/dsh-plugin-scheduled-tasks'
  - 'dsh-better-sidebar'
  - 'dsh-mcp-manager'
  - 'dshmarket'
  # Official @deepseek-ai runtime family — every rc cut publishes the whole
  # family fresh, so preapprove the family rather than each name per release.
  - '@deepseek-ai/dsh'
  - '@deepseek-ai/dsh-*'
